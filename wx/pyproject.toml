[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluximp-wxwidgets"
version = "0.1.3"
description = "FluxImp wxWidgets: desktop GUI providing multiple AI agent workflows for coding and web research"
readme = "README.md"
authors = [
    { name = "Josh Heitzman", email = "joshheitzman@hotmail.com" },
]
requires-python = ">=3.10,<3.13"
license = "MPL-2.0"
dependencies = [
    "fluximp-agent==0.1.3",
    "fluximp-protocol==0.1.3",
    "wxPython==4.2.4",
    "mistune==3.3.4",
]
