[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluximp-agent"
version = "0.2.0"
description = "FluxImp Agent: an AI agent harness for coding and web research"
readme = "README.md"
authors = [
    { name = "Josh Heitzman", email = "joshheitzman@hotmail.com" },
]
requires-python = ">=3.10,<3.13"
license = "MPL-2.0"
dependencies = [
    "fluximp-protocol==0.2.0",
    "fluximp-agent-sdk==0.2.0",
    "langgraph==1.1.10",
    "langchain-openai==1.2.1",
    "openai==2.33.0",
    "keyring==25.7.0",
    "python-ripgrep==0.0.9",
    "rapidfuzz==3.14.3",
    "langgraph-checkpoint-sqlite==3.0.3",
    "tavily-python==0.7.26",
    "exa_py==2.16.0",
    "linkup-sdk==0.18.3",
    "parallel-web==1.1.0",
    "perplexityai==0.40.0",
    "langchain-core==1.3.2",
    "httpx==0.28.1",
    "numpy==2.2.6",
    "typing_extensions==4.15.0",
    "regex>=2026.2.28,<=2026.4.4",
]

[project.urls]
"Homepage" = "https://fluximp.org"
