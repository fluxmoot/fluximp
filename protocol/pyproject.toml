[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluximp-protocol"
version = "0.3.0"
description = "FluxImp Protocol: the communication protocol between the FluxImp Agent and FluxImp GUI"
readme = "README.md"
authors = [
    { name = "Josh Heitzman", email = "joshheitzman@hotmail.com" },
]
requires-python = ">=3.10,<3.13"
license = "MPL-2.0"
dependencies = []

[project.urls]
"Homepage" = "https://fluximp.org"
